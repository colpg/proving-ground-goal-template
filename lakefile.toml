name = "example_goal"
# A bare `lake build` builds only the maintainers' library. The answers and the cuts are built by
# tools/build.sh, inside a sandbox, because an answer can run code while it builds.
defaultTargets = ["Example"]

[[lean_lib]]
name = "Example"

# Every file in Problems/ is a module of its own; there is no root module.
[[lean_lib]]
name = "Problems"
globs = ["Problems.+"]

# Every file in Proofs/ is a module of its own; there is no root module.
[[lean_lib]]
name = "Proofs"
globs = ["Proofs.+"]

# Every file in Cuts/ is a module of its own; there is no root module.
[[lean_lib]]
name = "Cuts"
globs = ["Cuts.+"]
